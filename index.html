<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oniline Book Library</title>
    <link rel="stylesheet" href="./assets/stylesheets/main.css">
</head>
<body>
    <dialog closedby="any" class="bk-modal" id="bk-dialog">
        <form class="bk-form" id="bk-form">
            <h1 class="bk-form-header">New BooK</h1>
            <div class="field">
                <label for="bk-title">
                    Book Title
                    <input type="text" id="bk-title" name="title" required>
                </label>
            </div>
            <div class="field">
                <label for="author">
                    Author
                    <input type="text" id="author" name="author" required>
                </label>
            </div>
            <div class="field">
                <label for="pages">
                    Number of Pages
                    <input type="number" id="pages" name="pages" required>
                </label>
            </div>
            <div class="field">
                <label for="read" class="read-label">
                    Read
                    <input type="checkbox" id="read" name="read">
                </label>
            </div>
            <div class="bk-form-btns">
                <button class="cancel" id="cancel-btn" formmethod="dialog" value="cancel" formnovalidate>Cancel</button>
                <button class="confirm" id="confirm-btn">Add</button>
            </div>
        </form>
    </dialog>
    <header>
        <div class="search">
            <form action="" class="search-form">
                <button>
                    <svg focusable="false" height="24px" viewBox="0 0 24 24" width="24px" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M20.49,19l-5.73-5.73C15.53,12.2,16,10.91,16,9.5C16,5.91,13.09,3,9.5,3S3,5.91,3,9.5C3,13.09,5.91,16,9.5,16 c1.41,0,2.7-0.47,3.77-1.24L19,20.49L20.49,19z M5,9.5C5,7.01,7.01,5,9.5,5S14,7.01,14,9.5S11.99,14,9.5,14S5,11.99,5,9.5z">
                        </path>
                        <path d="M0,0h24v24H0V0z" fill="none"></path>
                    </svg>
                </button>
                <input type="search" name="" placeholder="Search in library">
            </form>
        </div>
        <div class="profile">
            <div class="icons">
                <button id="settings-btn">
                    <svg class="" width="24px" height="24px" viewBox="0 0 24 24" fill="currentColor" focusable="false"><path d="M13.85 22.25h-3.7c-.74 0-1.36-.54-1.45-1.27l-.27-1.89c-.27-.14-.53-.29-.79-.46l-1.8.72c-.7.26-1.47-.03-1.81-.65L2.2 15.53c-.35-.66-.2-1.44.36-1.88l1.53-1.19c-.01-.15-.02-.3-.02-.46 0-.15.01-.31.02-.46l-1.52-1.19c-.59-.45-.74-1.26-.37-1.88l1.85-3.19c.34-.62 1.11-.9 1.79-.63l1.81.73c.26-.17.52-.32.78-.46l.27-1.91c.09-.7.71-1.25 1.44-1.25h3.7c.74 0 1.36.54 1.45 1.27l.27 1.89c.27.14.53.29.79.46l1.8-.72c.71-.26 1.48.03 1.82.65l1.84 3.18c.36.66.2 1.44-.36 1.88l-1.52 1.19c.01.15.02.3.02.46s-.01.31-.02.46l1.52 1.19c.56.45.72 1.23.37 1.86l-1.86 3.22c-.34.62-1.11.9-1.8.63l-1.8-.72c-.26.17-.52.32-.78.46l-.27 1.91c-.1.68-.72 1.22-1.46 1.22zm-3.23-2h2.76l.37-2.55.53-.22c.44-.18.88-.44 1.34-.78l.45-.34 2.38.96 1.38-2.4-2.03-1.58.07-.56c.03-.26.06-.51.06-.78s-.03-.53-.06-.78l-.07-.56 2.03-1.58-1.39-2.4-2.39.96-.45-.35c-.42-.32-.87-.58-1.33-.77l-.52-.22-.37-2.55h-2.76l-.37 2.55-.53.21c-.44.19-.88.44-1.34.79l-.45.33-2.38-.95-1.39 2.39 2.03 1.58-.07.56a7 7 0 0 0-.06.79c0 .26.02.53.06.78l.07.56-2.03 1.58 1.38 2.4 2.39-.96.45.35c.43.33.86.58 1.33.77l.53.22.38 2.55z"></path><circle cx="12" cy="12" r="3.5"></circle></svg>
                </button>
                <button id="theme-toggle-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            id="dark-theme-icon"
                            stroke="currentColor"
                            class="settings-icon"
                            role="img" aria-labelledby="">
                            <title id="">theme icon</title>
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z">
                            </path>
                        </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
                            id="light-theme-icon"
                            class="settings-icon hidden"
                            role="img" aria-labelledby="">
                            <title id="a6c398lutt2nciamecgu8hfpl7v5ldrz">theme icon</title>
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z">
                            </path>
                        </svg>
                </button>
            </div>
            <div class="account">
                <a href="#"><img src="https://avatars.githubusercontent.com/u/111270142?v=4&size=64" alt="profile pic" class="profile-pic"></a>
            </div>
        </div>        
    </header>
    <aside class="side-bar">
        <section class="branding"><a href="#"><img src="./assets/images/logo-x.jpg" alt="" width="60" class="logo">OB.Lib</a></section>
        <section class="tasks">
            <button class="bk-btn" id="bk-btn">
                <svg class="" width="24" height="24" viewBox="0 0 24 24" focusable="false"><path d="M20 13h-7v7h-2v-7H4v-2h7V4h2v7h7v2z"></path></svg> New
            </button>
        </section>
        
    </aside>
    <main>
        <section class="welcome">Welcome to My Online Book Library</section>
        <section class="book-list" id="book-list">
        </section>
    </main>
    <footer></footer>

    <script src="./assets/scripts/main.js"></script>
</body>
</html>
