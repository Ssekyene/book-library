<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Library</title>
    <link rel="stylesheet" href="./assets/stylesheets/main.css">
</head>
<body>
    <dialog closedby="any" class="bk-modal" id="bk-dialog">
        <form class="bk-form">
            <h1 class="bk-form-header">New BooK</h1>
            <div class="field">
                <label for="bk-title">
                    Book Title
                    <input type="text" id="bk-title">
                </label>
            </div>
            <div class="field">
                <label for="author">
                    Author
                    <input type="text" id="author">
                </label>
            </div>
            <div class="field">
                <label for="pages">
                    Number of Pages
                    <input type="number" id="pages">
                </label>
            </div>
            <div class="field">
                <label for="read" class="read-label">
                    Read
                    <input type="checkbox" id="read">
                </label>
            </div>
            <div class="bk-form-btns">
                <button class="cancel" id="cancel-btn" formmethod="dialog" value="cancel">Cancel</button>
                <button class="confirm" id="confirm-btn">Add</button>
            </div>
        </form>
    </dialog>
    <header>
        <div class="header-content">
            <div class="profile"></div>
        </div>        
    </header>
    <aside class="side-bar">
        <section class="branding"><a href="#"><img src="./assets/images/logo.jpg" alt="" width="50" class="logo">Book Lib</a></section>
        <section class="tasks">
            <button class="bk-btn" id="bk-btn">
                <svg class="" width="24" height="24" viewBox="0 0 24 24" focusable="false"><path d="M20 13h-7v7h-2v-7H4v-2h7V4h2v7h7v2z"></path></svg> New
            </button>
        </section>
        
    </aside>
    <main>
        <section class="welcome">Welcome to My Online Book Library</section>
        <section class="book-list">
            <div class="card">
                <div class="card-content">
                    <h1 class="title">48 Laws of Power</h1>
                    <p class="author">by <span class="name">Robert Green</span></p>
                    <p class="num-of-pages">342 pages</p>
                </div>
                <div class="card-footer">
                    <section class="read">
                        <span class="read-label">Mark as <span class="status">read</span>:</span>
                        <label for="read-checkbox" class="read-toggle">
                            <input type="checkbox" id="read-checkbox">
                            <span class="checkbox-control"></span>
                        </label>
                    </section>
                    <section class="remove-card">
                        <button class="remove-card-btn">Remove</button>
                    </section>
                </div>
            </div>
        </section>
    </main>
    <footer></footer>

    <script src="./assets/scripts/main.js"></script>
</body>
</html>
