<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Library</title>
    <link rel="stylesheet" href="./assets/stylesheets/main.css">
</head>
<body>
    <dialog closedby="any" class="add-bk-modal" id="new-bk-dialog">
        <form class="add-bk-form">
            <h1>New BooK</h1>
            <div>
                <label for="bk-title">
                    Book Title
                    <input type="text" id="bk-title">
                </label>
            </div>
            <div>
                <label for="author">
                    Author
                    <input type="text" id="author">
                </label>
            </div>
            <div>
                <label for="pages">
                    Number of Pages
                    <input type="number" id="pages">
                </label>
            </div>
            <div>
                <label for="read">
                    Read
                    <input type="checkbox" id="read">
                </label>
            </div>
            <div>
                <button class="cancel" id="cancel-btn" formmethod="dialog" value="cancel">Cancel</button>
                <button class="confirm" id="confirm-btn">Add</button>
            </div>
        </form>
    </dialog>
    <header>
        <div class="header-content">
            <div class="profile"></div>
        </div>        
    </header>
    <aside class="side-bar">
        <section class="branding"><a href="#"><img src="./assets/images/logo.jpg" alt="" width="50" class="logo">Book Lib</a></section>
        <section class="tasks">
            <button class="add-btn" id="new-bk-btn">
                <svg class="Q6yead QJZfhe " width="24" height="24" viewBox="0 0 24 24" focusable="false"><path d="M20 13h-7v7h-2v-7H4v-2h7V4h2v7h7v2z"></path></svg> New
            </button>
        </section>
        
    </aside>
    <main>
        <section class="welcome">Welcome to My Online Book Library</section>
        <section class="book-lib"></section>
    </main>
    <footer></footer>

    <script src="./assets/scripts/main.js"></script>
</body>
</html>
